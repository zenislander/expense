<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#243A8E">
<title>Receipt Ledger</title>
<style>
  :root{
    --paper:#F6F2E9; --card:#fff; --ink:#1C2230; --sub:#6B7280;
    --line:#E2DCCE; --blue:#243A8E; --blueSoft:#EEF0FA; --red:#B23B3B;
    --mono:'SF Mono','Roboto Mono',ui-monospace,Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);padding-bottom:96px}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select{font-family:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  header{background:var(--card);border-bottom:1px solid var(--line)}
  .perf{height:8px;background:radial-gradient(circle at 6px 8px,var(--paper) 5px,transparent 5px) repeat-x;background-size:12px 8px}
  .head-pad{padding:18px 20px 20px;position:relative}
  .gear{position:absolute;top:14px;right:16px;background:transparent;border:none;font-size:20px;color:var(--sub);line-height:1;padding:4px}
  .search{margin-bottom:10px}
  .ranges{display:flex;gap:8px;margin-bottom:12px}
  .range{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px}
  .range.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .mcat-cap{font-family:var(--mono);font-size:11px;margin-top:3px}
  .over{color:var(--red);font-weight:600}
  .modal-list{max-height:50vh;overflow-y:auto;margin:8px 0}
  .cat-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
  .cat-edit-row input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px}
  .cat-edit-row .bud{width:84px;flex:none}
  .cat-swatch{width:16px;height:16px;border-radius:4px;flex-shrink:0}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--sub);text-transform:uppercase}
  .total{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-1px;margin-top:4px}
  .total span{font-size:22px;color:var(--sub)}
  .catbar{display:flex;gap:4px;margin-top:14px;border-radius:6px;overflow:hidden;height:8px}
  .catbar div{height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  .legend span{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block}

  main{padding:16px 16px 0}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px;font-weight:600}
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .mcard-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-bottom:1px dashed var(--line)}
  .mcard-month{font-weight:700;font-size:15px}
  .mcard-total{font-family:var(--mono);font-weight:700;font-size:16px}
  .mcat{display:flex;align-items:center;gap:10px;padding:10px 16px}
  .mcat+.mcat{border-top:1px dashed var(--line)}
  .mcat-bar{flex:1;height:8px;border-radius:4px;background:var(--paper);overflow:hidden}
  .mcat-bar div{height:100%}
  .mcat-label{font-size:13px;min-width:96px}
  .mcat-amt{font-family:var(--mono);font-size:13px;min-width:64px;text-align:right;color:var(--sub)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px}
  .chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;white-space:nowrap}
  .chip.active{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:600}

  .ledger{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
  .row:active{background:var(--blueSoft)}
  .row+.row-sep{border-top:1px dashed var(--line);margin:0 16px}
  .ico{width:38px;height:38px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .ico span{width:12px;height:12px;border-radius:3px}
  .merch{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
  .amt{font-family:var(--mono);font-weight:700;font-size:15.5px}
  .empty{text-align:center;padding:60px 20px;color:var(--sub);font-size:14px}

  .field{margin-bottom:14px}
  .field.flex{flex:1}
  .label{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;letter-spacing:.3px}
  .inp{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--ink)}
  .inp.mono{font-family:var(--mono)}
  .pair{display:flex;gap:12px}
  .catpick{display:flex;flex-wrap:wrap;gap:8px}
  .catpick button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:999px;font-size:13px}
  .items{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 0}
  .item{display:flex;justify-content:space-between;padding:8px 14px;font-family:var(--mono);font-size:13px}
  .item+.item{border-top:1px dashed var(--line)}
  .item span:first-child{color:var(--sub)}

  .actions{display:flex;gap:12px;margin-top:20px}
  .btn{padding:13px 16px;border-radius:11px;font-size:15px;font-weight:600}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn-danger{background:var(--card);color:var(--red);border:1px solid var(--red)}

  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px}
  nav .btn{flex:1}
  nav .btn.scan{flex:1.6;display:flex;align-items:center;justify-content:center;gap:8px}

  .overlay{position:fixed;inset:0;background:rgba(28,34,48,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:360px;border:1px solid var(--line)}
  .scanning{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--blue);animation:pulse 1.2s infinite;text-align:center}
  .receipt-img{width:100%;max-height:220px;object-fit:contain;background:#000;border-radius:12px;margin-bottom:16px}
  .hide{display:none}
  .hint{font-size:13px;color:var(--sub);line-height:1.6;margin-top:6px}
  a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="perf"></div>
  <div class="head-pad">
    <button class="gear" id="settingsBtn" aria-label="Settings">⚙</button>
    <div class="eyebrow" id="monthLabel"></div>
    <div class="total" id="monthTotal"><span>$</span>0.00</div>
    <div class="catbar" id="catbar"></div>
    <div class="legend" id="legend"></div>
  </div>
</header>

<main id="listView">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="ledger">Ledger</button>
    <button class="tab" data-tab="months">By month</button>
  </div>
  <div id="ledgerTab">
    <input class="inp search" id="searchInp" type="search" placeholder="Search merchant, note, category…">
    <div class="ranges" id="ranges">
      <button class="range active" data-range="all">All time</button>
      <button class="range" data-range="thismonth">This month</button>
      <button class="range" data-range="lastmonth">Last month</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="ledger"></div>
  </div>
  <div id="monthsTab" class="hide"></div>
</main>

<main id="addView" class="hide"></main>

<nav id="nav">
  <button class="btn btn-ghost" id="manualBtn">Add manually</button>
  <button class="btn btn-primary scan" id="scanBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    Scan receipt
  </button>
</nav>

<!-- Real file input: on Android this opens Gallery / Camera chooser -->
<input type="file" id="fileInput" accept="image/*" class="hide">
<input type="file" id="importInput" accept="application/json,.json" class="hide">

<div id="modalRoot"></div>

<script>
const DEFAULT_CATEGORIES = [
  {id:"food",label:"Food & Dining",color:"#C2622C"},
  {id:"groceries",label:"Groceries",color:"#1F7A4D"},
  {id:"transport",label:"Transport",color:"#243A8E"},
  {id:"shopping",label:"Shopping",color:"#8B3A8B"},
  {id:"utilities",label:"Utilities",color:"#2A8B9B"},
  {id:"health",label:"Health",color:"#B23B3B"},
  {id:"travel",label:"Travel",color:"#B8852A"},
  {id:"other",label:"Other",color:"#6B7280"},
];
const PALETTE = ["#C2622C","#1F7A4D","#243A8E","#8B3A8B","#2A8B9B","#B23B3B","#B8852A","#6B7280","#7A5C2E","#4B6043","#5D3A8B","#9B2A6B"];
let CATEGORIES = DEFAULT_CATEGORIES.slice();
const catOf = id => CATEGORIES.find(c=>c.id===id) || {id:"other",label:"Other",color:"#6B7280"};
const fmt = n => (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const KEY_STORE = "rl_apikey";
const EXP_STORE = "rl_expenses";
const CAT_STORE = "rl_categories";
const BUDGET_STORE = "rl_budgets";

let expenses = [];
let budgets = {};         // { categoryId: monthlyCapNumber }
let filter = "all";
let search = "";
let rangeMode = "all";    // all | thismonth | lastmonth
let draft = null;

// ---- persistence (localStorage works in a normal browser) ----
function load(){
  try{ expenses = JSON.parse(localStorage.getItem(EXP_STORE)) || []; }catch{ expenses = []; }
  try{ const c = JSON.parse(localStorage.getItem(CAT_STORE)); if(Array.isArray(c)&&c.length) CATEGORIES = c; }catch{}
  try{ budgets = JSON.parse(localStorage.getItem(BUDGET_STORE)) || {}; }catch{ budgets = {}; }
}
function save(){ localStorage.setItem(EXP_STORE, JSON.stringify(expenses)); }
function saveCats(){ localStorage.setItem(CAT_STORE, JSON.stringify(CATEGORIES)); }
function saveBudgets(){ localStorage.setItem(BUDGET_STORE, JSON.stringify(budgets)); }
function getKey(){ return localStorage.getItem(KEY_STORE) || ""; }
function setKey(k){ localStorage.setItem(KEY_STORE, k); }

// ---- header / dashboard ----
function renderHeader(){
  const now = new Date();
  const monthKey = now.toISOString().slice(0,7);
  document.getElementById("monthLabel").textContent =
    now.toLocaleString(undefined,{month:"long",year:"numeric"}) + " · spent so far";
  const month = expenses.filter(x => (x.date||"").startsWith(monthKey));
  const total = month.reduce((s,x)=>s+(Number(x.total)||0),0);
  document.getElementById("monthTotal").innerHTML = '<span>$</span>'+fmt(total);

  const byCat = {};
  month.forEach(x => byCat[x.category] = (byCat[x.category]||0) + (Number(x.total)||0));
  const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const bar = document.getElementById("catbar");
  const legend = document.getElementById("legend");
  bar.innerHTML = ""; legend.innerHTML = "";
  if(total>0){
    sorted.forEach(([cid,amt])=>{
      const d=document.createElement("div");
      d.style.background=catOf(cid).color; d.style.width=(amt/total*100)+"%";
      d.title=catOf(cid).label; bar.appendChild(d);
    });
    sorted.slice(0,4).forEach(([cid,amt])=>{
      const s=document.createElement("span");
      s.innerHTML='<span class="dot" style="background:'+catOf(cid).color+'"></span>'+catOf(cid).label+' · $'+fmt(amt);
      legend.appendChild(s);
    });
  }
}

// ---- list ----
function renderChips(){
  const c = document.getElementById("chips");
  c.innerHTML = "";
  const mk = (id,label,color)=>{
    const b=document.createElement("button");
    b.className="chip"+(filter===id?" active":"");
    b.innerHTML=(color?'<span class="dot" style="background:'+(filter===id?'#fff':color)+'"></span>':'')+label;
    b.onclick=()=>{filter=id;renderChips();renderList();};
    c.appendChild(b);
  };
  mk("all","All");
  CATEGORIES.forEach(cat=>mk(cat.id,cat.label,cat.color));
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function monthKeyNow(offset){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+(offset||0));
  return d.toISOString().slice(0,7);
}
function passesFilters(x){
  if(filter!=="all" && x.category!==filter) return false;
  if(rangeMode==="thismonth" && !(x.date||"").startsWith(monthKeyNow(0))) return false;
  if(rangeMode==="lastmonth" && !(x.date||"").startsWith(monthKeyNow(-1))) return false;
  if(search){
    const q = search.toLowerCase();
    const hay = ((x.merchant||"")+" "+(x.note||"")+" "+catOf(x.category).label).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function renderList(){
  const wrap = document.getElementById("ledger");
  const rows = expenses.filter(passesFilters);
  if(!rows.length){
    const anyFilter = filter!=="all" || search || rangeMode!=="all";
    wrap.innerHTML = '<div class="empty">'+(anyFilter
      ? "No matching expenses." : "No expenses yet. Tap Scan receipt to begin.")+'</div>';
    return;
  }
  const led = document.createElement("div"); led.className="ledger";
  rows.forEach((x,i)=>{
    if(i>0){ const sep=document.createElement("div"); sep.className="row-sep"; led.appendChild(sep); }
    const r=document.createElement("div"); r.className="row";
    r.innerHTML =
      '<span class="ico" style="background:'+catOf(x.category).color+'1A"><span style="background:'+catOf(x.category).color+'"></span></span>'+
      '<div style="flex:1;min-width:0"><div class="merch">'+esc(x.merchant||"Untitled expense")+'</div>'+
      '<div class="meta">'+esc(catOf(x.category).label)+' · '+esc(x.date)+'</div></div>'+
      '<div class="amt">$'+fmt(x.total)+'</div>';
    r.onclick=()=>openEdit(x);
    led.appendChild(r);
  });
  wrap.innerHTML = ""; wrap.appendChild(led);
}

// ---- monthly breakdown by category ----
function monthName(key){
  const [y,m] = key.split("-");
  return new Date(Number(y), Number(m)-1, 1)
    .toLocaleString(undefined,{month:"long",year:"numeric"});
}
function renderMonths(){
  const wrap = document.getElementById("monthsTab");
  if(!expenses.length){
    wrap.innerHTML = '<div class="empty">No expenses yet. Tap Scan receipt to begin.</div>';
    return;
  }
  // group by YYYY-MM
  const months = {};
  expenses.forEach(x=>{
    const key = (x.date||"").slice(0,7);
    if(!key) return;
    (months[key] = months[key] || []).push(x);
  });
  const keys = Object.keys(months).sort().reverse(); // newest first

  wrap.innerHTML = keys.map(key=>{
    const rows = months[key];
    const monthTotal = rows.reduce((s,x)=>s+(Number(x.total)||0),0);
    const byCat = {};
    rows.forEach(x=>byCat[x.category]=(byCat[x.category]||0)+(Number(x.total)||0));
    const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const max = sorted.length ? sorted[0][1] : 1;

    const cats = sorted.map(([cid,amt])=>{
      const pct = max>0 ? (amt/max*100) : 0;
      const cap = Number(budgets[cid])||0;
      let capLine = "";
      if(cap>0){
        const over = amt>cap;
        const capPct = Math.min(100, amt/cap*100);
        capLine = '<div class="mcat-cap'+(over?' over':'')+'" style="color:'+(over?'':'var(--sub)')+'">'+
          '$'+fmt(amt)+' of $'+fmt(cap)+(over?' · over by $'+fmt(amt-cap):' ('+Math.round(capPct)+'%)')+'</div>';
      }
      return '<div class="mcat" style="flex-wrap:wrap">'+
        '<span class="mcat-label">'+esc(catOf(cid).label)+'</span>'+
        '<span class="mcat-bar"><div style="width:'+pct+'%;background:'+catOf(cid).color+'"></div></span>'+
        '<span class="mcat-amt">$'+fmt(amt)+'</span>'+
        capLine+
      '</div>';
    }).join("");

    return '<div class="mcard">'+
      '<div class="mcard-head"><span class="mcard-month">'+monthName(key)+'</span>'+
      '<span class="mcard-total">$'+fmt(monthTotal)+'</span></div>'+
      cats+'</div>';
  }).join("");
}

// ---- tabs ----
let activeTab = "ledger";
function setTab(tab){
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(b=>
    b.classList.toggle("active", b.dataset.tab===tab));
  document.getElementById("ledgerTab").classList.toggle("hide", tab!=="ledger");
  document.getElementById("monthsTab").classList.toggle("hide", tab!=="months");
  if(tab==="months") renderMonths();
}
document.querySelectorAll(".tab").forEach(b=>{
  b.onclick = ()=>setTab(b.dataset.tab);
});

// ---- search + range ----
document.getElementById("searchInp").addEventListener("input", e=>{
  search = e.target.value.trim(); renderList();
});
document.querySelectorAll(".range").forEach(b=>{
  b.onclick = ()=>{
    rangeMode = b.dataset.range;
    document.querySelectorAll(".range").forEach(r=>r.classList.toggle("active", r===b));
    renderList();
  };
});

// ---- settings: categories, budgets, export/import ----
document.getElementById("settingsBtn").onclick = openSettings;

function openSettings(){
  const rows = CATEGORIES.map(c=>
    '<div class="cat-edit-row">'+
      '<span class="cat-swatch" style="background:'+c.color+'"></span>'+
      '<input data-catid="'+c.id+'" value="'+esc(c.label)+'">'+
      '<input class="inp mono bud" data-budid="'+c.id+'" type="number" inputmode="decimal" placeholder="cap" value="'+(budgets[c.id]?esc(budgets[c.id]):"")+'">'+
    '</div>').join("");
  showModal('<div class="modal" style="max-width:380px">'+
    '<div style="font-weight:700;font-size:17px;margin-bottom:2px">Settings</div>'+
    '<div class="hint">Rename categories and set a monthly budget cap (leave blank for none). Existing expenses keep their category when you rename.</div>'+
    '<div class="modal-list">'+rows+
      '<div class="cat-edit-row" style="border-top:none;margin-top:6px">'+
        '<span class="cat-swatch" style="background:var(--line)"></span>'+
        '<input id="newCatName" placeholder="Add a category…">'+
        '<button class="btn btn-ghost bud" id="addCatBtn" style="padding:8px 0">Add</button>'+
      '</div>'+
    '</div>'+
    '<div style="border-top:1px dashed var(--line);padding-top:12px;margin-top:4px">'+
      '<div class="label">Backup & data</div>'+
      '<div class="actions" style="margin-top:0">'+
        '<button class="btn btn-ghost" id="expJson" style="flex:1">Export JSON</button>'+
        '<button class="btn btn-ghost" id="expCsv" style="flex:1">Export CSV</button>'+
      '</div>'+
      '<div class="actions" style="margin-top:10px">'+
        '<button class="btn btn-ghost" id="impBtn" style="flex:1">Import JSON</button>'+
        '<button class="btn btn-ghost" id="keyBtn" style="flex:1">Change API key</button>'+
      '</div>'+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn btn-ghost" id="setClose" style="flex:1">Close</button>'+
      '<button class="btn btn-primary" id="setSave" style="flex:1.4">Save changes</button>'+
    '</div></div>');

  document.getElementById("addCatBtn").onclick = ()=>{
    const name = document.getElementById("newCatName").value.trim();
    if(!name) return;
    const id = "c"+Date.now();
    CATEGORIES.push({id, label:name, color:PALETTE[CATEGORIES.length % PALETTE.length]});
    saveCats(); openSettings();
  };
  document.getElementById("setClose").onclick = ()=>{ closeModal(); };
  document.getElementById("setSave").onclick = ()=>{
    document.querySelectorAll("[data-catid]").forEach(inp=>{
      const c = CATEGORIES.find(c=>c.id===inp.dataset.catid);
      if(c && inp.value.trim()) c.label = inp.value.trim();
    });
    budgets = {};
    document.querySelectorAll("[data-budid]").forEach(inp=>{
      const v = parseFloat(inp.value);
      if(v>0) budgets[inp.dataset.budid] = v;
    });
    saveCats(); saveBudgets(); closeModal(); renderAll();
  };
  document.getElementById("expJson").onclick = exportJson;
  document.getElementById("expCsv").onclick = exportCsv;
  document.getElementById("impBtn").onclick = ()=>document.getElementById("importInput").click();
  document.getElementById("keyBtn").onclick = ()=>{ closeModal(); askForKey(()=>{}); };
}

function download(filename, text, mime){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function stamp(){ return new Date().toISOString().slice(0,10); }
function exportJson(){
  const payload = {version:1, exported:new Date().toISOString(), categories:CATEGORIES, budgets, expenses};
  download("receipt-ledger-"+stamp()+".json", JSON.stringify(payload,null,2), "application/json");
}
function exportCsv(){
  const cols = ["date","merchant","category","total","tax","currency","note"];
  const head = cols.join(",");
  const lines = expenses.map(x=>cols.map(k=>{
    let v = k==="category" ? catOf(x.category).label : (x[k]==null?"":x[k]);
    v = String(v).replace(/"/g,'""');
    return /[",\n]/.test(v) ? '"'+v+'"' : v;
  }).join(","));
  download("receipt-ledger-"+stamp()+".csv", [head,...lines].join("\n"), "text/csv");
}
document.getElementById("importInput").addEventListener("change", async e=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.expenses)) throw new Error("Not a valid backup file.");
    showModal('<div class="modal">'+
      '<div style="font-weight:700;font-size:17px;margin-bottom:8px">Import backup?</div>'+
      '<div class="hint">Found '+data.expenses.length+' expenses. Choose how to bring them in.</div>'+
      '<div class="actions"><button class="btn btn-ghost" id="impMerge" style="flex:1">Merge</button>'+
      '<button class="btn btn-primary" id="impReplace" style="flex:1">Replace all</button></div>'+
      '<button class="btn btn-ghost" id="impCancel" style="width:100%;margin-top:10px">Cancel</button></div>');
    const apply = (replace)=>{
      if(Array.isArray(data.categories) && data.categories.length){ CATEGORIES = data.categories; saveCats(); }
      if(data.budgets && typeof data.budgets==="object"){ budgets = data.budgets; saveBudgets(); }
      if(replace){ expenses = data.expenses; }
      else {
        const ids = new Set(expenses.map(x=>x.id));
        data.expenses.forEach(x=>{ if(!ids.has(x.id)) expenses.push(x); });
      }
      expenses.sort((a,b)=>a.date<b.date?1:-1);
      save(); closeModal(); renderAll();
    };
    document.getElementById("impMerge").onclick = ()=>apply(false);
    document.getElementById("impReplace").onclick = ()=>apply(true);
    document.getElementById("impCancel").onclick = closeModal;
  }catch(err){
    showModal('<div class="modal"><div style="font-weight:700;color:var(--red);margin-bottom:8px">Import failed</div>'+
      '<div class="hint">'+esc(err.message||"Couldn\'t read that file.")+'</div>'+
      '<button class="btn btn-primary" id="impErrOk" style="width:100%;margin-top:14px">OK</button></div>');
    document.getElementById("impErrOk").onclick = closeModal;
  }
});


function blankDraft(){
  draft = {id:Date.now(),merchant:"",date:new Date().toISOString().slice(0,10),
    total:0,tax:0,currency:"USD",category:"other",items:[],note:"",image:null};
  renderForm();
}
function openEdit(x){ draft = JSON.parse(JSON.stringify(x)); renderForm(); }

function renderForm(){
  document.getElementById("listView").classList.add("hide");
  document.getElementById("nav").classList.add("hide");
  const v = document.getElementById("addView");
  v.classList.remove("hide");
  v.style.animation = "slideUp .25s ease";
  const isEdit = expenses.some(e=>e.id===draft.id);

  v.innerHTML =
    (draft.image ? '<img class="receipt-img" src="'+draft.image+'" alt="Receipt">' : '') +
    field("Merchant", inp("merchant","Where did you spend?")) +
    '<div class="pair">'+ field("Total", inp("total","",true,"number"),true) +
                          field("Date", inp("date","",false,"date"),true) +'</div>'+
    '<div class="pair">'+ field("Tax", inp("tax","",true,"number"),true) +
                          field("Currency", inp("currency","",true),true) +'</div>'+
    field("Category", catPicker()) +
    (draft.items&&draft.items.length ? field("Line items (from receipt)", itemsHtml()) : "") +
    field("Note", inp("note","Optional")) +
    '<div class="actions">'+
      '<button class="btn btn-ghost" id="cancelBtn" style="flex:1">Cancel</button>'+
      (isEdit?'<button class="btn btn-danger" id="deleteBtn" style="flex:1">Delete</button>':'')+
      '<button class="btn btn-primary" id="saveBtn" style="flex:1.4">Save expense</button>'+
    '</div>';

  v.querySelectorAll("[data-k]").forEach(el=>{
    el.oninput = e=>{
      let val = e.target.value;
      if(el.dataset.k==="currency") val = val.toUpperCase();
      draft[el.dataset.k] = val;
    };
  });
  v.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick=()=>{ draft.category=b.dataset.cat; renderForm(); };
  });
  document.getElementById("cancelBtn").onclick = closeForm;
  document.getElementById("saveBtn").onclick = saveDraft;
  const del = document.getElementById("deleteBtn");
  if(del) del.onclick = ()=>{ expenses=expenses.filter(e=>e.id!==draft.id); save(); closeForm(); };
}
function field(label,inner,flex){return '<div class="field'+(flex?" flex":"")+'"><div class="label">'+label+'</div>'+inner+'</div>';}
function inp(k,ph,mono,type){
  const t=type||"text";
  return '<input class="inp'+(mono?" mono":"")+'" data-k="'+k+'" type="'+t+'" '+(t==="number"?'inputmode="decimal"':'')+
    ' value="'+String(draft[k]??"").replace(/"/g,"&quot;")+'" placeholder="'+(ph||"")+'">';
}
function catPicker(){
  return '<div class="catpick">'+CATEGORIES.map(c=>{
    const on=draft.category===c.id;
    return '<button data-cat="'+c.id+'" style="'+(on?'border-color:'+c.color+';background:'+c.color+'14;color:'+c.color+';font-weight:600':'')+'">'+c.label+'</button>';
  }).join("")+'</div>';
}
function itemsHtml(){
  return '<div class="items">'+draft.items.map(it=>
    '<div class="item"><span>'+(it.name||"")+'</span><span>$'+fmt(it.price)+'</span></div>').join("")+'</div>';
}
function saveDraft(){
  const exists = expenses.some(e=>e.id===draft.id);
  draft.total = Number(draft.total)||0; draft.tax = Number(draft.tax)||0;
  if(exists) expenses = expenses.map(e=>e.id===draft.id?draft:e);
  else expenses = [draft, ...expenses];
  expenses.sort((a,b)=>a.date<b.date?1:-1);
  save(); closeForm();
}
function closeForm(){
  draft=null;
  document.getElementById("addView").classList.add("hide");
  document.getElementById("listView").classList.remove("hide");
  document.getElementById("nav").classList.remove("hide");
  renderAll();
}

// ---- modals ----
function showModal(html){ document.getElementById("modalRoot").innerHTML = '<div class="overlay">'+html+'</div>'; }
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

function askForKey(then){
  showModal('<div class="modal">'+
    '<div style="font-weight:700;font-size:17px;margin-bottom:4px">Connect your Claude API key</div>'+
    '<div class="hint">Stored only on this device. Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>. You can revoke it anytime.</div>'+
    '<input class="inp mono" id="keyInp" type="password" placeholder="sk-ant-..." style="margin:14px 0">'+
    '<div class="actions" style="margin-top:0">'+
      '<button class="btn btn-ghost" id="keyCancel" style="flex:1">Cancel</button>'+
      '<button class="btn btn-primary" id="keySave" style="flex:1.4">Save key</button>'+
    '</div></div>');
  document.getElementById("keyInp").value = getKey();
  document.getElementById("keyCancel").onclick = closeModal;
  document.getElementById("keySave").onclick = ()=>{
    const k=document.getElementById("keyInp").value.trim();
    if(k){ setKey(k); closeModal(); if(then) then(); }
  };
}

// ---- the scan pipeline ----
function startScan(){
  if(!getKey()){ askForKey(()=>document.getElementById("fileInput").click()); return; }
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", async e=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  await processImage(file);
});

// Resize an image file to fit within maxDim on its longest side, return JPEG base64.
function downscale(file, maxDim){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width:w, height:h} = img;
      if(Math.max(w,h) > maxDim){
        const s = maxDim / Math.max(w,h);
        w = Math.round(w*s); h = Math.round(h*s);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
      resolve({ base64: dataUrl.split(",")[1], media_type: "image/jpeg" });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Couldn't load that image")); };
    img.src = url;
  });
}

async function processImage(file){
  showModal('<div class="modal"><div class="scanning">READING RECEIPT…</div>'+
    '<div class="hint" style="text-align:center;margin-top:8px">Pulling out merchant, date, total and category</div></div>');
  try{
    // Phone cameras shoot >8000px; Claude caps at 8000px and uses ~1568px max
    // internally, so downscale first — smaller is faster and cheaper too.
    const {base64, media_type} = await downscale(file, 1568);
    const prompt = 'You are reading a photographed receipt. Extract the expense details and respond with ONLY a JSON object, no markdown, no preamble. Use this exact shape:\n'+
      '{"merchant":"store name or empty","date":"YYYY-MM-DD or empty","total":number,"tax":number,'+
      '"currency":"ISO code, default USD","category":one of ["food","groceries","transport","shopping","utilities","health","travel","other"],'+
      '"items":[{"name":"line item","price":number}]}\n'+
      'Pick the category that best matches the merchant/items. Use defaults if a field is unreadable.';

    const resp = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":getKey(),
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type,data:base64}},
          {type:"text",text:prompt}
        ]}]
      })
    });
    const data = await resp.json();
    if(data.type==="error" || !data.content){
      const msg = data.error && data.error.message ? data.error.message : "API request failed";
      throw new Error(msg);
    }
    const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    closeModal();
    draft = {
      id:Date.now(),
      merchant:parsed.merchant||"",
      date:parsed.date||new Date().toISOString().slice(0,10),
      total:parsed.total||0, tax:parsed.tax||0,
      currency:parsed.currency||"USD",
      category:catOf(parsed.category).id,
      items:Array.isArray(parsed.items)?parsed.items:[],
      note:"", image:"data:"+media_type+";base64,"+base64
    };
    renderForm();
  }catch(err){
    const keyish = /api[_ ]?key|authentication|x-api-key|401/i.test(err.message||"");
    showModal('<div class="modal">'+
      '<div style="font-weight:700;color:var(--red);margin-bottom:8px">Scan failed</div>'+
      '<div class="hint">'+(keyish
        ? "That looks like an API key problem. Re-enter your key and try again."
        : "Couldn\'t read that receipt: "+(err.message||"unknown error")+". Try a clearer photo, or add it by hand.")+'</div>'+
      '<div class="actions">'+
        '<button class="btn btn-ghost" id="errHand" style="flex:1">Add by hand</button>'+
        (keyish?'<button class="btn btn-primary" id="errKey" style="flex:1">Fix key</button>'
               :'<button class="btn btn-primary" id="errRetry" style="flex:1">Retry photo</button>')+
      '</div></div>');
    document.getElementById("errHand").onclick=()=>{closeModal();blankDraft();};
    const rk=document.getElementById("errKey"); if(rk) rk.onclick=()=>{closeModal();askForKey(startScan);};
    const rr=document.getElementById("errRetry"); if(rr) rr.onclick=()=>{closeModal();startScan();};
  }
}

// ---- wire up ----
document.getElementById("scanBtn").onclick = startScan;
document.getElementById("manualBtn").onclick = blankDraft;

function renderAll(){ renderHeader(); renderChips(); renderList(); if(activeTab==="months") renderMonths(); }
load();
